<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Primary meta -->
    <title>newsprint — turn text into newspaper clippings &amp; ransom notes</title>
    <meta
      name="description"
      content="Type a sentence and get it back cut out of a newspaper. Every word becomes its own scrap of procedurally generated newsprint — its own typeface, paper, ink damage and torn edge. No image input anywhere, no upload: the paper, grain and print are all generated in your browser. Exports PNG up to 4x."
    />
    <meta
      name="keywords"
      content="newspaper clipping generator, ransom note generator, cut out letters, newsprint texture, torn paper effect, procedural typography, zine typography, tabloid headline, text to image, collage lettering, PNG export, in-browser, no upload, seeded, deterministic"
    />
    <meta name="author" content="chakri68" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://newsprint.chakri.me/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="newsprint" />
    <meta
      property="og:title"
      content="newsprint — turn text into newspaper clippings &amp; ransom notes"
    />
    <meta
      property="og:description"
      content="Type a sentence, get it back cut out of a newspaper. Every word gets its own typeface, its own scrap of generated newsprint, its own ink damage and torn edge. Nothing is uploaded and no image goes in."
    />
    <meta property="og:url" content="https://newsprint.chakri.me/" />
    <meta property="og:image" content="https://newsprint.chakri.me/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

      property="og:image:alt"
      content="The word NEWSPRINT spelled out in nine newspaper letter cutouts, each in a different typeface on its own scrap of aged newsprint"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="newsprint — turn text into newspaper clippings &amp; ransom notes"
    />
    <meta
      name="twitter:description"
      content="Type a sentence, get it back cut out of a newspaper. Type, paper, ink and tear all generated in your browser. No image input, no upload."
    />
    <meta name="twitter:image" content="https://newsprint.chakri.me/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The word NEWSPRINT spelled out in nine newspaper letter cutouts, each in a different typeface"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- UI chrome only. The nine faces the artwork is cut from are injected from
         JS instead (see core/fonts.ts) so they never block first paint. -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Pixel font: display=block so the boot title never flashes a fallback. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block"
      rel="stylesheet"
    />

    <!-- Critical CSS for the boot screen only.
         The app itself is masked until its stylesheet has applied (Vite injects
         CSS via JS in dev, so there is a real flash to kill) -- but masking the
         whole body, as this used to, hid the boot screen behind it and left the
         page pure black for as long as the fonts took. So the mask covers #app
         and the boot screen is styled inline, which means it paints on the very
         first frame with nothing loaded but this file. -->
    <style>
      html {
        background: #000;
      }
      body {
        margin: 0;
      }
      #app {
        visibility: hidden;
      }
      body.booted #app {
        visibility: visible;
      }
      .intro {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        background: #000;
        color: #8b8574;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .intro-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 0 24px;
        text-align: center;
      }
      .intro-title {
        font-family: "Press Start 2P", ui-monospace, monospace;
        font-size: 22px;
        letter-spacing: -0.5px;
        color: #ffb000;
        text-shadow: 0 0 14px rgba(255, 176, 0, 0.5);
      }
      .intro-sub {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
      }
      .intro-bar {
        width: min(260px, 60vw);
        height: 3px;
        background: #2b2925;
        border-radius: 999px;
        overflow: hidden;
      }
      .intro-fill {
        height: 100%;
        width: 0%;
        background: #ffb000;
      }
      .intro-note {
        font-size: 11px;
        color: #4f4a40;
      }
    </style>
    <noscript
      ><style>
        #app {
          visibility: visible;
        }
        .intro {
          display: none;
        }
      </style></noscript
    >
    <!-- Amber Phosphor theme tokens — single source of truth. Render-blocking,
         so the tokens are in effect before anything paints; the inline critical
         CSS above covers the frames before this lands (and the case where it
         never does). -->
    <link rel="stylesheet" href="https://theme.chakri.me/tokens.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "newsprint",
        "url": "https://newsprint.chakri.me/",
        "description": "Turn any sentence into newspaper clippings. Each word or letter is rendered as a separate scrap of procedurally generated newsprint with its own typeface, paper texture, background print, ink degradation and torn edge. Text is the only input — no images are uploaded or used. Deterministic: the same text, settings and seed always reproduce the same artwork. Exports PNG at up to 4x.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any (modern web browser)",
        "browserRequirements": "Requires JavaScript and HTML canvas",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "chakri68" }
      }
    </script>

    <!-- Cloudflare Web Analytics -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "b30517a8f61f45fdbc96a569ad86d79e"}'
    ></script>
    <!-- End Cloudflare Web Analytics -->
  </head>
  <body>
    <!-- Boot screen. In the markup rather than injected by JS so it is on
         screen from the first paint, before the bundle has even parsed. -->
    <div class="intro" id="intro">
      <div class="intro-inner">
        <div class="intro-title">newsprint</div>
        <div class="intro-sub" id="intro-sub">setting type</div>
        <div class="intro-bar"><div class="intro-fill" id="intro-fill"></div></div>
        <div class="intro-note">nine faces, then nothing leaves your browser</div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
