<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- A scrap of newsprint with one amber headline bar. Black ground and a
       single accent, per the amber-phosphor theme; the torn bottom edge is the
       only detail that still reads at 16px. -->
  <rect width="32" height="32" fill="#000"/>
  <g transform="rotate(-4 16 16)">
    <path fill="#f2ede1" d="M4.5 6.2 27.5 7.1 27.4 23.6 24.6 25.4 21.4 23.7 18.1 25.6 14.6 23.8 11.2 25.5 7.8 23.7 4.6 25.2 Z"/>
    <rect x="7" y="10.6" width="18" height="5" fill="#ffb000"/>
    <rect x="7" y="17.6" width="18" height="1.6" fill="#8b8574"/>
    <rect x="7" y="20.4" width="12" height="1.6" fill="#8b8574"/>
  </g>
</svg>
